
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Dash - Endless Runner</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #101b30;
  color: white;
  user-select: none;
  -webkit-user-select: none;
}
canvas { display: block; }
#hud {
  position: fixed;
  inset: 0 0 auto 0;
  display: flex;
  justify-content: space-between;
  padding: 16px;
  pointer-events: none;
  z-index: 2;
}
.stat {
  background: #101b30d9;
  border: 1px solid #ffffff30;
  border-radius: 12px;
  padding: 10px 14px;
  font-weight: bold;
  box-shadow: 0 4px 15px #0003;
}
#message {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #08142680;
  z-index: 5;
  padding: 20px;
}
.panel {
  width: min(420px, 100%);
  text-align: center;
  background: #12243af2;
  border: 1px solid #ffffff30;
  border-radius: 24px;
  padding: 28px 22px;
  box-shadow: 0 15px 60px #0008;
}
h1 {
  font-size: clamp(32px, 8vw, 48px);
  margin: 0 0 8px;
  color: #62f5e7;
}
.panel p { line-height: 1.6; color: #d5e5f7; }
button {
  border: 0;
  border-radius: 12px;
  background: #62f5e7;
  color: #102034;
  font-weight: bold;
  font-size: 16px;
  padding: 14px 22px;
  cursor: pointer;
  touch-action: manipulation;
}
button:active { transform: scale(.96); }
#startBtn { width: 100%; margin-top: 8px; }
#controls {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  z-index: 3;
  pointer-events: none;
}
#controls button {
  width: 62px;
  height: 58px;
  padding: 0;
  font-size: 24px;
  background: #12243ad9;
  color: white;
  border: 1px solid #ffffff50;
  pointer-events: auto;
  touch-action: none;
}
#controls button.action { background: #62f5e7; color: #102034; }
#hint {
  position: fixed;
  bottom: 94px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 12px;
  color: #fff;
  text-shadow: 0 2px 4px #000;
  pointer-events: none;
  z-index: 2;
}
.hidden { display: none !important; }
.small { font-size: 12px; opacity: .8; }
</style>
</head>
<body>

<div id="hud">
  <div class="stat">⭐ Score: <span id="score">0</span></div>
  <div class="stat">🪙 Coins: <span id="coins">0</span></div>
  <div class="stat">⚡ <span id="speed">1.0</span>x</div>
</div>

<div id="message">
  <div class="panel">
    <h1 id="title">NEON DASH</h1>
    <p id="description">
      Run, jump, slide and collect coins!<br>
      Avoid obstacles and see how far you can go.
    </p>
    <button id="startBtn">▶ START RUNNING</button>
    <p class="small">
      Keyboard: ← → move · ↑ / Space jump · ↓ slide<br>
      Mobile: swipe or use the buttons
    </p>
  </div>
</div>

<div id="hint">SWIPE TO MOVE · JUMP OVER BARRIERS · SLIDE UNDER GATES</div>

<div id="controls">
  <button id="leftBtn" aria-label="Move left">◀</button>
  <button id="jumpBtn" class="action" aria-label="Jump">⬆</button>
  <button id="slideBtn" aria-label="Slide">⬇</button>
  <button id="rightBtn" aria-label="Move right">▶</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- GAME SETTINGS ----------
const LANES = [-2.2, 0, 2.2];
const PLAYER_Z = 4;
const $ = id => document.getElementById(id);

let scene, camera, renderer, clock;
let player, body, head, leftLeg, rightLeg;
let roadLines = [];
let scenery = [];
let objects = [];
let particles = [];

let running = false;
let gameOver = false;
let lane = 1;
let jumpY = 0;
let jumpVelocity = 0;
let sliding = false;
let slideTime = 0;
let runTime = 0;
let distance = 0;
let coinCount = 0;
let speed = 15;
let spawnTimer = 0;
let coinTimer = 0;
let lastTime = 0;
let best = 0;
let touchX = 0;
let touchY = 0;

try {
  best = Number(localStorage.getItem('neonDashBest') || 0);
} catch (e) {}

// ---------- SCENE ----------
scene = new THREE.Scene();
scene.background = new THREE.Color(0x91d7f5);
scene.fog = new THREE.Fog(0x91d7f5, 35, 105);

camera = new THREE.PerspectiveCamera(
  65, window.innerWidth / window.innerHeight, 0.1, 180
);
camera.position.set(0, 5.5, 10.5);
camera.lookAt(0, 1, -5);

renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

clock = new THREE.Clock();

scene.add(new THREE.HemisphereLight(0xdff5ff, 0x52617a, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(-8, 15, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// ---------- MATERIALS ----------
const mat = (color, roughness = 0.8, metalness = 0) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness });

const roadMat = mat(0x303949);
const lineMat = mat(0xffffff);
const grassMat = mat(0x58b96a);
const skinMat = mat(0xffc69a);
const shirtMat = mat(0x00d9cb, 0.45);
const pantsMat = mat(0x25345b);
const shoeMat = mat(0xf4f7ff);
const goldMat = new THREE.MeshStandardMaterial({
  color: 0xffc928,
  metalness: 0.7,
  roughness: 0.25,
  emissive: 0x805000
});
const redMat = mat(0xf04d5c);
const blueMat = mat(0x36a9ff);
const darkMat = mat(0x202b40);

// ---------- BASIC 3D HELPERS ----------
function box(w, h, d, material, x, y, z, parent = scene) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d), material
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function cylinder(rt, rb, h, material, x, y, z, parent = scene) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(rt, rb, h, 8), material
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

// ---------- WORLD ----------
box(200, 0.2, 200, grassMat, 0, -0.22, -45);
box(7.2, 0.18, 200, roadMat, 0, -0.1, -45);

// Lane markers
for (const x of [-1.1, 1.1]) {
  for (let i = 0; i < 20; i++) {
    const marker = box(0.055, 0.025, 2.4, lineMat, x, 0.005, -i * 5);
    roadLines.push(marker);
  }
}

// Roadside lamps and trees
for (let i = 0; i < 18; i++) {
  const z = -i * 7;
  for (const side of [-1, 1]) {
    const x = side * (5 + Math.random() * 2);
    const lamp = new THREE.Group();
    lamp.position.set(x, 0, z);
    scene.add(lamp);
    cylinder(0.08, 0.1, 3.2, darkMat, 0, 1.6, 0, lamp);
    box(0.55, 0.12, 0.2, mat(0xfff1a3), -side * 0.18, 3.2, 0, lamp);
    scenery.push(lamp);

    const tree = new THREE.Group();
    tree.position.set(side * (10 + Math.random() * 3), 0, z - 2);
    scene.add(tree);
    cylinder(0.22, 0.32, 1.5, mat(0x785037), 0, 0.75, 0, tree);

    const leaves = new THREE.Mesh(
      new THREE.ConeGeometry(1.15, 2.8, 7),
      mat(0x248b65)
    );
    leaves.position.y = 2.5;
    leaves.castShadow = true;
    tree.add(leaves);
    scenery.push(tree);
  }
}

// ---------- PLAYER ----------
player = new THREE.Group();
player.position.set(0, 0, PLAYER_Z);
scene.add(player);

body = box(0.72, 0.95, 0.42, shirtMat, 0, 1.25, 0, player);
head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), skinMat);
head.position.set(0, 2.05, 0);
head.castShadow = true;
player.add(head);

// Hair and face details
const hairMat = mat(0x35251e);
const hair = new THREE.Mesh(
  new THREE.SphereGeometry(0.305, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2),
  hairMat
);
hair.position.copy(head.position);
hair.position.y += 0.08;
player.add(hair);

for (const x of [-0.105, 0.105]) {
  const eye = new THREE.Mesh(
    new THREE.SphereGeometry(0.035, 8, 8),
    darkMat
  );
  eye.position.set(x, 2.08, -0.275);
  player.add(eye);
}

leftLeg = box(0.24, 0.65, 0.27, pantsMat, -0.2, 0.45, 0, player);
rightLeg = box(0.24, 0.65, 0.27, pantsMat, 0.2, 0.45, 0, player);

box(0.3, 0.15, 0.4, shoeMat, -0.2, 0.1, -0.04, player);
box(0.3, 0.15, 0.4, shoeMat, 0.2, 0.1, -0.04, player);

box(0.2, 0.65, 0.23, skinMat, -0.49, 1.28, 0, player);
box(0.2, 0.65, 0.23, skinMat, 0.49, 1.28, 0, player);

// ---------- OBJECT CREATION ----------
function makeObstacle(type, x, z) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  scene.add(group);

  if (type === 'barrier') {
    box(1.45, 0.7, 0.35, redMat, 0, 0.65, 0, group);
    box(1.55, 0.13, 0.4, lineMat, 0, 0.67, -0.02, group);
    box(0.15, 0.3, 0.15, darkMat, -0.53, 0.15, 0, group);
    box(0.15, 0.3, 0.15, darkMat, 0.53, 0.15, 0, group);
  } else if (type === 'gate') {
    box(1.65, 0.18, 0.25, blueMat, 0, 1.65, 0, group);
    box(0.15, 1.7, 0.22, darkMat, -0.72, 0.85, 0, group);
    box(0.15, 1.7, 0.22, darkMat, 0.72, 0.85, 0, group);
  } else {
    box(1.2, 1.15, 1.0, mat(0xa16a46), 0, 0.58, 0, group);
    box(0.95, 0.12, 0.08, mat(0xe1b08c), 0, 0.58, -0.51, group);
  }

  objects.push({
    kind: 'obstacle', type, mesh: group, hit: false
  });
}

function makeCoin(x, z) {
  const coin = new THREE.Mesh(
    new THREE.TorusGeometry(0.28, 0.09, 8, 16), goldMat
  );
  coin.position.set(x, 1.05, z);
  coin.castShadow = true;
  scene.add(coin);
  objects.push({ kind: 'coin', mesh: coin, hit: false });
}

function spawnObstacleRow() {
  const chosen = Math.floor(Math.random() * 3);
  const types = ['barrier', 'gate', 'crate'];
  const type = types[Math.floor(Math.random() * types.length)];

  makeObstacle(type, LANES[chosen], -65);

  // Sometimes place coins in a neighboring lane.
  if (Math.random() < 0.65) {
    const other = (chosen + (Math.random() < 0.5 ? 1 : 2)) % 3;
    for (let i = 0; i < 4; i++) {
      makeCoin(LANES[other], -52 - i * 2);
    }
  }
}

function spawnCoinLine() {
  const chosen = Math.floor(Math.random() * 3);
  for (let i = 0; i < 6; i++) {
    makeCoin(LANES[chosen], -60 - i * 2.2);
  }
}

// ---------- GAME CONTROLS ----------
function moveLeft() {
  if (running) lane = Math.max(0, lane - 1);
}
function moveRight() {
  if (running) lane = Math.min(2, lane + 1);
}
function jump() {
  if (running && jumpY <= 0.01 && !sliding) {
    jumpVelocity = 9.5;
  }
}
function slide() {
  if (running && jumpY <= 0.05) {
    sliding = true;
    slideTime = 0.75;
  }
}

window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) {
    e.preventDefault();
  }
  if (e.repeat) return;

  if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft();
  if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight();
  if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') jump();
  if (e.code === 'ArrowDown' || e.code === 'KeyS') slide();
  if (e.code === 'Enter' && !running) startGame();
});

$('leftBtn').addEventListener('pointerdown', e => {
  e.preventDefault(); moveLeft();
});
$('rightBtn').addEventListener('pointerdown', e => {
  e.preventDefault(); moveRight();
});
$('jumpBtn').addEventListener('pointerdown', e => {
  e.preventDefault(); jump();
});
$('slideBtn').addEventListener('pointerdown', e => {
  e.preventDefault(); slide();
});

renderer.domElement.addEventListener('pointerdown', e => {
  touchX = e.clientX;
  touchY = e.clientY;
});
renderer.domElement.addEventListener('pointerup', e => {
  const dx = e.clientX - touchX;
  const dy = e.clientY - touchY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    dx < 0 ? moveLeft() : moveRight();
  } else {
    dy < 0 ? jump() : slide();
  }
});

// ---------- GAME FLOW ----------
function clearObjects() {
  for (const obj of objects) {
    scene.remove(obj.mesh);
    obj.mesh.traverse?.(child => {
      if (child.geometry) child.geometry.dispose();
    });
  }
  objects = [];
}

function startGame() {
  clearObjects();

  running = true;
  gameOver = false;
  lane = 1;
  jumpY = 0;
  jumpVelocity = 0;
  sliding = false;
  slideTime = 0;
  runTime = 0;
  distance = 0;
  coinCount = 0;
  speed = 15;
  spawnTimer = 1;
  coinTimer = 2;
  lastTime = 0;

  player.position.set(0, 0, PLAYER_Z);
  player.scale.set(1, 1, 1);
  player.rotation.set(0, 0, 0);

  $('score').textContent = '0';
  $('coins').textContent = '0';
  $('speed').textContent = '1.0';
  $('message').classList.add('hidden');
  clock.start();
}

function endGame() {
  if (!running) return;
  running = false;
  gameOver = true;

  const finalScore = Math.floor(distance) + coinCount * 10;
  best = Math.max(best, finalScore);
  try {
    localStorage.setItem('neonDashBest', String(best));
  } catch (e) {}

  $('title').textContent = 'GAME OVER';
  $('description').innerHTML =
    `Score: <b>${finalScore}</b><br>` +
    `Coins collected: <b>${coinCount}</b><br>` +
    `Best score: <b>${best}</b><br>` +
    `Ready for another run?`;

  $('startBtn').textContent = '↻ PLAY AGAIN';
  $('message').classList.remove('hidden');
}

// ---------- UPDATE ----------
function update(dt) {
  if (!running) return;

  runTime += dt;
  speed = Math.min(29, 15 + runTime * 0.22);
  distance += speed * dt * 0.45;

  $('score').textContent = String(
    Math.floor(distance) + coinCount * 10
  );
  $('coins').textContent = String(coinCount);
  $('speed').textContent = (speed / 15).toFixed(1);

  // Smoothly move the player between lanes.
  const targetX = LANES[lane];
  player.position.x += (targetX - player.position.x) *
    Math.min(1, dt * 12);

  // Jump physics.
  if (jumpY > 0 || jumpVelocity > 0) {
    jumpVelocity -= 23 * dt;
    jumpY += jumpVelocity * dt;

    if (jumpY < 0) {
      jumpY = 0;
      jumpVelocity = 0;
    }
  }

  if (sliding) {
    slideTime -= dt;
    if (slideTime <= 0) sliding = false;
  }

  player.position.y = jumpY;
  player.scale.y = sliding ? 0.55 : 1;
  player.position.y += sliding ? 0 : 0;

  // Running animation.
  if (jumpY < 0.05 && !sliding) {
    const swing = Math.sin(runTime * 13) * 0.35;
    leftLeg.rotation.x = swing;
    rightLeg.rotation.x = -swing;
  } else {
    leftLeg.rotation.x = 0;
    rightLeg.rotation.x = 0;
  }

  body.rotation.z = (targetX - player.position.x) * -0.08;
  head.rotation.z = body.rotation.z * 0.4;

  // Move lane markings toward the player.
  for (const marker of roadLines) {
    marker.position.z += speed * dt;
    if (marker.position.z > 10) marker.position.z -= 100;
  }

  // Recycle scenery.
  for (const item of scenery) {
    item.position.z += speed * dt;
    if (item.position.z > 15) item.position.z -= 126;
  }

  // Spawn rows of obstacles and coins.
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnObstacleRow();
    spawnTimer = Math.max(0.85, 1.65 - runTime * 0.008);
  }

  coinTimer -= dt;
  if (coinTimer <= 0) {
    if (Math.random() < 0.7) spawnCoinLine();
    coinTimer = 3.2 + Math.random() * 1.5;
  }

  // Move objects and check collisions.
  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    const mesh = obj.mesh;
    mesh.position.z += speed * dt;

    if (obj.kind === 'coin') {
      mesh.rotation.y += dt * 4;
      mesh.rotation.x = 0.3;
    }

    if (!obj.hit &&
        Math.abs(mesh.position.z - PLAYER_Z) < 0.95 &&
        Math.abs(mesh.position.x - player.position.x) < 0.9) {

      if (obj.kind === 'coin') {
        obj.hit = true;
        coinCount++;
        scene.remove(mesh);
        objects.splice(i, 1);
        continue;
      }

      // Barriers can be jumped over; gates require sliding.
      if (obj.type === 'barrier') {
        if (jumpY < 0.85) {
          endGame();
          return;
        }
      } else if (obj.type === 'gate') {
        if (!sliding) {
          endGame();
          return;
        }
      } else {
        // Crates require changing lanes.
        endGame();
        return;
      }
    }

    if (mesh.position.z > 12) {
      scene.remove(mesh);
      objects.splice(i, 1);
    }
  }

  // Slight camera motion adds a running-game feel.
  camera.position.x += (player.position.x * 0.12 - camera.position.x) *
    dt * 1.5;
  camera.lookAt(player.position.x * 0.12, 1.1, -5);
}

// ---------- MAIN LOOP ----------
function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.04);

  if (!running) {
    // Gentle idle coin-like animation is unnecessary; keep the
    // title screen stable and lightweight.
  } else {
    update(dt);
  }

  renderer.render(scene, camera);
}

$('startBtn').addEventListener('click', startGame);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.7));
});

animate();
</script>
</body>
</html>
